<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель керування WMS</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Верхня панель */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .btn {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0051cb;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Три колонки складу */
        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .column {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        .column h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        .list {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Прості плашки для посилок */
        .item {
            font-size: 13px;
            padding: 8px 12px;
            background: #f5f5f7;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #ccc;
        }

        .item.VIP { border-left-color: #ff3b30; }
        .item.Express { border-left-color: #ff9500; }
        .item.Standard { border-left-color: #34c759; }
        .item.Fragile { border-left-color: #af52de; }

        .type-text {
            font-size: 11px;
            font-weight: bold;
            color: #666;
        }

        /* Спрощений термінал логів */
        .logs-section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
        }

        .logs-section h3 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: #666;
            font-weight: 500;
        }

        .terminal {
            font-family: monospace;
            font-size: 12px;
            color: #444;
            height: 180px;
            overflow-y: auto;
            line-height: 1.6;
            background: #fafafa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #f0f0f0;
        }

        .msg-sys { color: #0070f3; }
        .msg-ok { color: #34c759; }
        .msg-err { color: #ff3b30; }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Панель керування WMS</h1>
        <button class="btn" id="startBtn">Запустити симуляцію</button>
    </div>

    <div class="columns">
        <div class="column">
            <h3>📥 Зона приймання</h3>
            <div class="list" id="arrivalList"></div>
        </div>
        <div class="column">
            <h3>⏳ Сортувальна черга</h3>
            <div class="list" id="queueList"></div>
        </div>
        <div class="column">
            <h3>🚚 Зона відвантаження</h3>
            <div class="list" id="dispatchList"></div>
        </div>
    </div>

    <div class="logs-section">
        <h3>💻 Системний логгер</h3>
        <div class="terminal" id="terminalLog">
            Натисніть кнопку для старту симуляції...
        </div>
    </div>

</div>

<script type="module">
    import { EventEmitter } from "./eventEmitter.js";
    import { packageGenerator, consumeGeneratorWithTimeout } from "./generator.js";
    import { memoize } from "./memoize.js";
    import { BiDirectionalPriorityQueue } from "./priorityQueue.js";
    import { asyncFilter } from "./asyncFilter.js";
    import { createAsyncStream } from "./asyncStream.js";
    import { ApiService, AuthProxy } from "./authProxy.js";
    import { withLogging } from "./logger.js";

    const startBtn = document.getElementById('startBtn');
    const arrivalList = document.getElementById('arrivalList');
    const queueList = document.getElementById('queueList');
    const dispatchList = document.getElementById('dispatchList');
    const terminalLog = document.getElementById('terminalLog');

    function uiLog(message, type = '') {
        const line = document.createElement('div');
        if(type === 'system') line.className = 'msg-sys';
        if(type === 'success') line.className = 'msg-ok';
        if(type === 'error') line.className = 'msg-err';
        line.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
        terminalLog.appendChild(line);
        terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    async function runVisualSimulation() {
        startBtn.disabled = true;
        arrivalList.innerHTML = '';
        queueList.innerHTML = '';
        dispatchList.innerHTML = '';
        terminalLog.innerHTML = '';

        uiLog("=== СИМУЛЯЦІЮ ЗАПУЩЕНО ===", "system");

        const warehouseEvents = new EventEmitter();
        const outboundQueue = new BiDirectionalPriorityQueue();

        warehouseEvents.subscribe("package_arrived", (pkg) => {
            uiLog(`WMS: Посилка #${pkg.id} (${pkg.type}) прибула.`);

            const item = document.createElement('div');
            item.className = `item ${pkg.type}`;
            item.innerHTML = `<span>#${pkg.id} (${pkg.weight} кг)</span> <span class="type-text">${pkg.type}</span>`;
            arrivalList.appendChild(item);
            arrivalList.scrollTop = arrivalList.scrollHeight;

            const queueItem = item.cloneNode(true);
            queueItem.id = `q-${pkg.id}`;
            queueList.appendChild(queueItem);
        });

        const rawCalculation = (weight, distance) => {
            return parseFloat((weight * 2.5 + distance * 1.2).toFixed(2));
        };
        const loggedCalculation = (weight, distance) => {
            uiLog(`[Log] Розрахунок: ${weight}кг, ${distance}км`, "system");
            return rawCalculation(weight, distance);
        };
        const memoizedCostCalc = memoize(loggedCalculation, { maxSize: 3, policy: "LRU" });

        uiLog("Генерація та приймання посилок...");
        await consumeGeneratorWithTimeout(packageGenerator, 2.5, (pkg) => {
            warehouseEvents.emit("package_arrived", pkg);
            let priority = 1;
            if (pkg.type === "VIP") priority = 10;
            if (pkg.type === "Express") priority = 5;
            outboundQueue.enqueue(pkg, priority);
        });

        uiLog("Перевірка кешування обчислень...", "system");
        uiLog(`Виклик 1 (10кг, 100км): ${memoizedCostCalc(10, 100)} грн`);
        uiLog(`Виклик 2 (10кг, 100км) [З КЕШУ]: ${memoizedCostCalc(10, 100)} грн`);
        uiLog(`Виклик 3 (5кг, 50км): ${memoizedCostCalc(5, 50)} грн`);

        uiLog("Сортування та відвантаження (за пріоритетом)...", "system");
        let nextToDispatch = outboundQueue.dequeue(true, true);
        while (nextToDispatch) {
            await new Promise(r => setTimeout(r, 250));

            uiLog(`Відвантажено: Посилка #${nextToDispatch.id} [${nextToDispatch.type}]`, "success");

            const qEl = document.getElementById(`q-${nextToDispatch.id}`);
            if(qEl) qEl.remove();

            const dItem = document.createElement('div');
            dItem.className = `item ${nextToDispatch.type}`;
            dItem.innerHTML = `<span>#${nextToDispatch.id} (Готово)</span> <span class="type-text">${nextToDispatch.type}</span>`;
            dispatchList.appendChild(dItem);
            dispatchList.scrollTop = dispatchList.scrollHeight;

            nextToDispatch = outboundQueue.dequeue(true, true);
        }

        uiLog("Тест асинхронного фільтра...");
        const testPackages = [{ id: 101, weight: 5 }, { id: 102, weight: 45 }, { id: 103, weight: 12 }];
        const controller = new AbortController();
        try {
            const heavyPackages = await asyncFilter(testPackages, async (p) => p.weight > 10, controller.signal);
            uiLog(`Фільтр (вага > 10кг): ${JSON.stringify(heavyPackages)}`);
        } catch (err) {
            uiLog("Помилка фільтра: " + err.message, "error");
        }

        uiLog("Читання логів через Async Stream...");
        const heavyLogs = ["Лог: Сканер ОК", "Лог: Стрічка ОК", "Лог: Ворота ОК"];
        const stream = createAsyncStream(heavyLogs);
        for await (const chunk of stream) {
            uiLog(`[Стрім]: ${chunk}`);
        }

        uiLog("Відправка фінального звіту через захищений Proxy...", "system");
        const apiService = new ApiService();
        const secureProxy = new AuthProxy(apiService, "SECRET_JWT_TOKEN_123");
        const response = await secureProxy.sendData({ report: "Зміна успішно завершена." });
        uiLog(`Відповідь сервера: Статус ${response.status} | ${response.data || response.message}`, "success");

        uiLog("=== СИМУЛЯЦІЮ ЗАВЕРШЕНО ===", "success");
        startBtn.disabled = false;
    }

    startBtn.addEventListener('click', runVisualSimulation);
</script>
</body>
</html>
